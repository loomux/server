# Tests and a vulnerability scan for every PR and main push (LOOM-125).
# image.yml builds and verifies the image; this is the code itself.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The orchestrator and router integration tests drive a real tmux.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # -shuffle=on surfaces tests that depend on order (the seed is in the
      # log to reproduce); the timeout is above Go's 10m default, which the
      # slowest package nears on a loaded runner.
      - run: go test -race -shuffle=on -timeout 20m ./...
      # Every test runs tmux on a socket of its own and removes it
      # (internal/tmuxtest, LOOM-210). tmux leaves a socket file behind
      # even when its server exits, so a "loomux" one here means a test
      # started the server an instance uses.
      - name: Tests left no tmux socket and never used loomux
        if: always()
        run: |
          dir="${TMUX_TMPDIR:-/tmp}/tmux-$(id -u)"
          ls -la "$dir" 2>/dev/null || true
          test ! -e "$dir/loomux" && test -z "$(ls "$dir" 2>/dev/null | grep '^loomuxtest-')"

  # Changelog fragments (changes/*.md) are well-formed.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/changelog.sh check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fails on a vulnerability the code can reach; one only in a module it
      # requires but never calls is reported, not failed.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
