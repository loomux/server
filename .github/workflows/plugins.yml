# Tests and builds the first-party plugin images, ghcr.io/loomux/
# plugin-kubernetes (LOOM-179) and ghcr.io/loomux/plugin-docker
# (LOOM-180), and hands the tested images to the release run (LOOM-194).
#
# Two ways in:
#   - workflow_call from image.yml, the release run: with the version
#     being released and the agent image it resolved (agent.yml), each
#     plugin's unit tests, conformance and end to end, image build,
#     smoke test and scan run, and the tested images are uploaded as
#     artifacts; image.yml's publish job pushes them beside the server
#     image once every job passed, so the digest that is published and
#     attested is the one that passed. Nothing here pushes.
#   - pull_request, path-filtered: the same tests, no artifacts. A
#     change under deploy/agent also builds and smoke-tests the agent
#     image here (agent.yml publishes it on main).
#
# The end-to-end runs (a kind cluster, about nine minutes; the runner's
# docker engine) happen when plugin code changed: always on a pull
# request (the paths say so) and on a release whose push touched
# plugins/, deploy/test/kind, deploy/agent or these workflows. The
# images are built, smoke tested and scanned on every release
# regardless, so a release without a plugin change ships the same
# tested code under its new version.
#
# Actions are pinned by commit, with the release in a comment.
name: plugins

on:
  workflow_call:
    inputs:
      version:
        description: "The release version (X.Y.Z); empty when the run has none"
        type: string
        default: ""
      agent_image:
        description: "The agent image to test against, ghcr.io/loomux/agent:<tag>@sha256:<digest>; empty builds one from deploy/agent"
        type: string
        default: ""
  pull_request:
    paths:
      - "deploy/agent/**"
      - "deploy/test/kind/**"
      - "plugins/kubernetes/**"
      - "plugins/docker/**"
      - ".github/workflows/plugins.yml"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether plugin code changed since the previous push to main; a pull
  # request, or a run with no known previous commit, runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
      short: ${{ steps.diff.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          e2e=true
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ -n "${BEFORE}" ] &&
             [ "${BEFORE}" != 0000000000000000000000000000000000000000 ] &&
             git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --quiet "${BEFORE}" HEAD -- plugins deploy/test/kind deploy/agent \
                 .github/workflows/plugins.yml .github/workflows/agent.yml; then
              e2e=false
              echo "No plugin code changed since ${BEFORE}: the end-to-end runs are skipped."
            fi
          fi
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"

  # A pull request that touches the agent image: build, smoke test and
  # scan it (agent.yml does the same before publishing on main).
  agent-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/agent
          load: true
          tags: loomux-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash deploy/agent/smoke.sh loomux-agent:test

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loomux-agent:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The Kubernetes plugin (LOOM-179, plugins/kubernetes): its own
  # module's unit tests; then the conformance suite and an end-to-end
  # run (create, wait for running, ssh in through a port-forward, stop,
  # start, destroy) against a kind cluster with the §10 manifests
  # (deploy/test/kind), as the plugin's ServiceAccount; then its image.
  plugin-kubernetes:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/kubernetes/go.mod

      - name: Unit tests
        working-directory: plugins/kubernetes
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The agent image the machines run: the one this release pins, or
      # (a pull request) one built from deploy/agent.
      - name: The release's agent image for the cluster
        if: needs.changes.outputs.e2e == 'true' && inputs.agent_image != ''
        env:
          AGENT_IMAGE: ${{ inputs.agent_image }}
        run: |
          docker pull "${AGENT_IMAGE}"
          docker tag "${AGENT_IMAGE}" loomux-agent:test

      - name: Build the agent image for the cluster
        if: needs.changes.outputs.e2e == 'true' && inputs.agent_image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/agent
          load: true
          tags: loomux-agent:test
          cache-from: type=gha

      # kind itself, in a plain step: the repository allows only actions
      # from loomux, GitHub or verified creators, and helm/kind-action is
      # none of those. The release binary is pinned by version and by
      # its sha256 (kind-linux-amd64.sha256sum of that release); the
      # cluster is deploy/test/kind/cluster/kind.yaml, its node image
      # pinned by digest. kubectl is the runner's.
      - name: Bring up kind
        if: needs.changes.outputs.e2e == 'true'
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version
          kind create cluster --config deploy/test/kind/cluster/kind.yaml --wait 120s

      - name: Load the agent image and apply the manifests
        if: needs.changes.outputs.e2e == 'true'
        run: |
          kind load docker-image loomux-agent:test --name loomux
          kubectl apply -f deploy/test/kind/
          sh deploy/test/kind/kubeconfig-for-sa.sh > "${RUNNER_TEMP}/plugin.kubeconfig"

      # Plain kind enforces no NetworkPolicy: the check must say so
      # (LOOMUX_KIND_ENFORCED=1 expects the opposite, for a cluster
      # with a working policy engine).
      - name: Conformance and end to end on kind
        if: needs.changes.outputs.e2e == 'true'
        working-directory: plugins/kubernetes
        env:
          LOOMUX_KIND_KUBECONFIG: ${{ runner.temp }}/plugin.kubeconfig
          LOOMUX_KIND_AGENT_IMAGE: loomux-agent:test
        run: go test -tags kind -count=1 -timeout 15m -run TestKind -v ./...

      # kube-network-policies installed into kind enforced nothing on the
      # runner (its canary still reached the API server), so the
      # "enforced" verdict is pinned by unit tests on the canary's exit
      # codes and observed for real on TEST, where the engine runs.

      - name: What the cluster holds afterwards
        if: always() && needs.changes.outputs.e2e == 'true'
        run: |
          kubectl -n loomux-agents get pods,pvc,secrets -o wide || true
          kubectl -n loomux-agents get events --sort-by=.lastTimestamp | tail -n 40 || true

      # Its own labels (version, revision, source, and its own title and
      # description), as the agent image's (LOOM-194).
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/loomux/plugin-kubernetes
          labels: |
            org.opencontainers.image.version=${{ inputs.version || format('sha-{0}', needs.changes.outputs.short) }}
            org.opencontainers.image.title=loomux-plugin-kubernetes
            org.opencontainers.image.description=Loomux Kubernetes target-provider plugin: a pod per machine

      - name: Build the plugin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: plugins/kubernetes/Dockerfile
          load: true
          tags: ghcr.io/loomux/plugin-kubernetes:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the plugin image
        run: bash plugins/kubernetes/smoke.sh ghcr.io/loomux/plugin-kubernetes:test

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/loomux/plugin-kubernetes:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Handed to image.yml's publish job, which pushes it once every
      # job of the release passed.
      - name: Save the tested image for publish
        if: github.event_name != 'pull_request'
        run: docker save ghcr.io/loomux/plugin-kubernetes:test | zstd -T0 -o plugin-kubernetes-image.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: plugin-kubernetes-image
          path: plugin-kubernetes-image.tar.zst
          retention-days: 1
          if-no-files-found: error

  # The Docker plugin (LOOM-180, plugins/docker): its own module's unit
  # tests and vulnerability scan; then the conformance suite and an
  # end-to-end run (create, wait for running, ssh in at the published
  # port on 127.0.0.1 with the pinned host key, stop, start, recreate,
  # destroy) against the runner's own Docker engine over its socket,
  # and again through SSH to the runner itself (targets/sshtest, whose
  # shell runs the real docker system dial-stdio); then its image.
  plugin-docker:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/docker/go.mod

      - name: Unit tests
        working-directory: plugins/docker
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

      - name: Vulnerability scan
        working-directory: plugins/docker
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The agent image the machines run: the one this release pins, or
      # (a pull request) one built from deploy/agent.
      - name: The release's agent image for the engine
        if: needs.changes.outputs.e2e == 'true' && inputs.agent_image != ''
        env:
          AGENT_IMAGE: ${{ inputs.agent_image }}
        run: |
          docker pull "${AGENT_IMAGE}"
          docker tag "${AGENT_IMAGE}" loomux-agent:test

      - name: Build the agent image for the engine
        if: needs.changes.outputs.e2e == 'true' && inputs.agent_image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/agent
          load: true
          tags: loomux-agent:test
          cache-from: type=gha

      - name: Conformance and end to end against the runner's engine
        if: needs.changes.outputs.e2e == 'true'
        working-directory: plugins/docker
        env:
          LOOMUX_DOCKER_ENGINE: unix:///var/run/docker.sock
          LOOMUX_DOCKER_AGENT_IMAGE: loomux-agent:test
        run: go test -tags docker -count=1 -timeout 15m -run TestDocker -v ./...

      - name: What the engine holds afterwards
        if: always() && needs.changes.outputs.e2e == 'true'
        run: |
          docker ps -a --filter label=loomux.io/managed-by=loomux-plugin-docker || true
          docker volume ls --filter label=loomux.io/managed-by=loomux-plugin-docker || true

      # Its own labels (version, revision, source, and its own title and
      # description), as the agent image's (LOOM-194).
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/loomux/plugin-docker
          labels: |
            org.opencontainers.image.version=${{ inputs.version || format('sha-{0}', needs.changes.outputs.short) }}
            org.opencontainers.image.title=loomux-plugin-docker
            org.opencontainers.image.description=Loomux Docker target-provider plugin: a container per machine on one docker host

      - name: Build the plugin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: plugins/docker/Dockerfile
          load: true
          tags: ghcr.io/loomux/plugin-docker:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the plugin image
        run: bash plugins/docker/smoke.sh ghcr.io/loomux/plugin-docker:test

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/loomux/plugin-docker:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save the tested image for publish
        if: github.event_name != 'pull_request'
        run: docker save ghcr.io/loomux/plugin-docker:test | zstd -T0 -o plugin-docker-image.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: plugin-docker-image
          path: plugin-docker-image.tar.zst
          retention-days: 1
          if-no-files-found: error
