# The release run (LOOM-51, LOOM-129, LOOM-194; docs/release/versioning.md):
# builds ghcr.io/loomux/server and, through the reusable workflows it
# calls, the agent and plugin images, and publishes them all under the
# version a merge to main reserves. version -> agent (agent.yml: reused
# or rebuilt and published) -> image (the server, built with the agent
# pin) and plugins (plugins.yml: tested and built with it) -> publish
# (one matrix: server, plugin-kubernetes, plugin-docker, each as
# :X.Y.Z, :sha-<short> and :main, the server also its legacy bare
# :<short>, attested) -> release (the GitHub release, naming each
# image's tag@digest). A pull request builds and verifies the server
# image only; plugin pull requests run plugins.yml on their own.
#
# Two things here are less boilerplate than they look:
#
#   1. The web client's static bundle comes from a separate repo
#      (loomux/web, public), which publishes each tested main commit as a
#      pre-release `web-<short sha>` (LOOM-58; loomux/web docs/release.md).
#      This workflow downloads the release deploy/web-ref pins and checks
#      its tarball against deploy/web-sha256: the expected digest lives in
#      this repo, so a release replaced after review (web-release.json
#      included) can't change what ships. loomux/web is public, so this
#      workflow's own token reads its releases: no cross-repo secret, and a
#      fork's pull request builds too. A missing bundle still fails the
#      build loudly rather than shipping the placeholder UI (see the
#      "Guard" step below).
#   2. The image is verified by *running it* before it is pushed. loomuxd
#      execs ssh/tmux/sh at runtime, so a green `go build` says nothing
#      about whether the image can actually dispatch. See
#      docs/deploy/container.md.
name: image

on:
  push:
    branches: [main]
    # A release (LOOM-129, docs/release/versioning.md): v + SemVer 2.0.0.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      web_ref:
        description: "loomux/web commit sha whose web-<sha> release to use (default: deploy/web-ref)"
        required: false
        type: string
      web_sha256:
        description: "sha256 of that release's tarball (required with web_ref)"
        required: false
        type: string
      bump:
        description: "On main: release the next MINOR version (0.y.0) instead of only building"
        required: false
        type: choice
        options: [none, minor]
        default: none

env:
  IMAGE: ghcr.io/loomux/server

jobs:
  # The version this run releases (LOOM-129, docs/release/versioning.md),
  # settled before anything is built: a merge to main reserves the next
  # patch (or, asked by hand, minor) by creating its tag on the merge
  # commit through the API, which refuses a tag that exists, so racing
  # merges each get their own; nothing is ever queued or cancelled. A
  # hand-pushed tag is checked. A plain rebuild or a PR has no version.
  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -eu
          version=""
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="$(deploy/release.sh version "${GITHUB_REF_NAME}")"
            git merge-base --is-ancestor HEAD origin/main || {
              echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }
            deploy/release.sh notes "${version}" >/dev/null
          elif [ "${GITHUB_REF}" = refs/heads/main ] &&
               { [ "${GITHUB_EVENT_NAME}" = push ] || [ "${BUMP:-none}" = minor ]; }; then
            kind=patch
            if [ "${BUMP:-none}" = minor ]; then kind=minor; fi
            version="$(deploy/release.sh reserve "${GITHUB_SHA}" "${kind}")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version:-none}" >> "$GITHUB_STEP_SUMMARY"

  # The agent image this release pins (agent.yml): the current one when
  # deploy/agent didn't change, otherwise rebuilt and published first,
  # since the server and plugin builds name it by digest.
  agent:
    needs: version
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.version.result == 'success' }}
    uses: ./.github/workflows/agent.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true

  image:
    needs: [version, agent]
    if: ${{ !cancelled() && needs.version.result != 'failure' && needs.agent.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web_version: ${{ steps.meta.outputs.web_version }}
      web_short: ${{ steps.webref.outputs.short }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Check out loomux/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version tags, to continue the release line.
          fetch-depth: 0

      - name: Resolve the loomux/web commit
        id: webref
        env:
          OVERRIDE: ${{ inputs.web_ref }}
          OVERRIDE_SHA256: ${{ inputs.web_sha256 }}
        run: |
          if [ -n "${OVERRIDE}" ]; then
            ref="${OVERRIDE}"
            sha256="${OVERRIDE_SHA256}"
          else
            ref="$(tr -d '[:space:]' < deploy/web-ref)"
            sha256="$(tr -d '[:space:]' < deploy/web-sha256)"
          fi
          if ! [[ "${ref}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::loomux/web ref '${ref}' is not a commit sha. deploy/web-ref (or the" \
                 "override) must name a commit on loomux/web main: its web-<sha> release is used."
            exit 1
          fi
          # The trust anchor: the digest reviewed in this repo, not the one
          # the release says about itself.
          if ! [[ "${sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected sha256 '${sha256}' is not 64 hex characters. deploy/web-sha256" \
                 "(or web_sha256 with a web_ref override) must be the release tarball's sha256."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "short=${ref:0:7}" >> "$GITHUB_OUTPUT"
          echo "Using the UI from loomux/web release web-${ref:0:7}"

      # The release holds the bundle loomux/web's own CI built and tested,
      # and web-release.json naming its commit and sha256 (LOOM-58).
      - name: Download the loomux/web release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.webref.outputs.ref }}
          SHA256: ${{ steps.webref.outputs.sha256 }}
          TAG: web-${{ steps.webref.outputs.short }}
        run: |
          set -euo pipefail
          if ! gh release download "${TAG}" -R loomux/web -D web-release \
               -p web-release.json -p 'loomux-web-*.tar.gz'; then
            echo "::error::No loomux/web release ${TAG}. Only commits pushed to loomux/web main" \
                 "after LOOM-58 have one; check its CI run for that commit."
            exit 1
          fi
          commit="$(jq -r .commit web-release/web-release.json)"
          tarball="$(jq -r .tarball web-release/web-release.json)"
          if [[ "${commit}" != "${REF}"* ]]; then
            echo "::error::${TAG} is for commit ${commit}, not ${REF}."
            exit 1
          fi
          if [[ "${tarball}" != loomux-web-*.tar.gz || "${tarball}" == */* ]]; then
            echo "::error::unexpected tarball name in web-release.json: ${tarball}"
            exit 1
          fi
          if ! echo "${SHA256}  web-release/${tarball}" | sha256sum -c -; then
            echo "::error::${TAG}'s tarball doesn't match deploy/web-sha256. The release changed" \
                 "since the pin was reviewed, or the pin is wrong: don't build from it."
            exit 1
          fi
          if [[ "$(jq -r .sha256 web-release/web-release.json)" != "${SHA256}" ]]; then
            echo "::error::${TAG}'s web-release.json disagrees with deploy/web-sha256."
            exit 1
          fi
          mkdir .web-dist
          tar -xzf "web-release/${tarball}" -C .web-dist --no-same-owner
          # The bundle says what it is, so loomuxd can compare it with newer
          # releases (LOOM-118).
          cp web-release/web-release.json .web-dist/web-release.json

      - name: Guard — the bundle actually exists
        run: |
          if [ ! -f .web-dist/index.html ]; then
            echo "::error::The loomux/web release has no index.html. Refusing to continue:" \
                 "the Dockerfile would silently fall back to the placeholder UI."
            exit 1
          fi
          echo "Bundle:"; ls -la .web-dist

      - name: Compute tags
        id: meta
        env:
          RELEASE: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          WEB_REF: ${{ steps.webref.outputs.ref }}
        run: |
          set -eu
          short="$(git rev-parse --short=7 HEAD)"
          echo "sha=${short}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          # The web client's own version, from its tag on the pinned commit:
          # the highest, since a MINOR's commit also has its patch tag. Every
          # page: web-* release tags sort before v* and outgrow one page.
          web_version="$(gh api --paginate "repos/loomux/web/tags?per_page=100" \
            --jq ".[] | select(.commit.sha == \"${WEB_REF}\") | .name" |
            sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' |
            sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          echo "web_version=${web_version}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE:-${short}} (web ${web_version:-${{ steps.webref.outputs.short }}})" >> "$GITHUB_OUTPUT"

      # OCI labels: the action's version/revision/source/created, with
      # the title and description of this image rather than of the
      # repository, and the version as the release, or sha-<short>
      # without one, as every image labels it: publish-image.sh reuses a
      # commit tag only under this run's version label (LOOM-194).
      - name: Image labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=loomux-server
            org.opencontainers.image.description=Loomux server (loomuxd): chat-driven multi-agent tmux orchestration
            org.opencontainers.image.version=${{ steps.meta.outputs.release || format('sha-{0}', steps.meta.outputs.sha) }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built and loaded locally first, never built straight to the registry:
      # the verification step below is a publish gate, and a pushed-then-failed
      # image is already visible to anything watching the tag.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            WEB_DIST=.web-dist
            RELEASE=${{ steps.meta.outputs.release }}
            AGENT_IMAGE=${{ needs.agent.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The check that a `go build` cannot make: loomuxd shells out to these
      # binaries at runtime, so their absence is invisible until a dispatch
      # fails in production. `nc` must be the OpenBSD one — busybox's has no
      # -X, and -X 5 is the SOCKS5 ProxyCommand used to reach targets through
      # a userspace-mode Tailscale sidecar (LOOM-52).
      #
      # The last two assertions enforce the promise in docs/deploy/container.md
      # that CI never silently ships the UI-less placeholder: one greps for the
      # placeholder's own wording (coupled to deploy/web-placeholder/index.html),
      # the other requires the /assets directory that a real Vite build emits.
      - name: Verify the image can actually run
        env:
          RELEASE: ${{ steps.meta.outputs.release }}
        run: |
          docker run --rm -e RELEASE --entrypoint /bin/sh "${IMAGE}:${{ steps.meta.outputs.sha }}" -c '
            set -e
            ssh -V
            tmux -V
            nc -h 2>&1 | grep -q -- "-X proto" || { echo "MISSING: OpenBSD nc (no -X)"; exit 1; }
            missing=""
            for b in sh ssh tmux nc socat; do
              command -v "$b" >/dev/null || missing="$missing $b"
            done
            [ -z "$missing" ] || { echo "MISSING:$missing"; exit 1; }
            loomuxd -version
            test -f /srv/loomux/web/index.html || { echo "MISSING: web bundle"; exit 1; }
            if grep -q "built without a web client bundle" /srv/loomux/web/index.html; then
              echo "FAIL: the placeholder page shipped as the UI (WEB_DIST did not take effect)"
              exit 1
            fi
            test -d /srv/loomux/web/assets || { echo "FAIL: no /assets in the bundle - not a real Vite build"; exit 1; }
            # The bundled plugins carry this release (LOOM-194): the
            # manifest the host reads says the version the run is.
            for m in /usr/local/lib/loomux/plugins/*/plugin.json; do
              want="${RELEASE:-0.0.0-dev}"
              grep -q "\"version\": \"${want}\"" "$m" || { echo "FAIL: $m is not stamped ${want}"; cat "$m"; exit 1; }
            done
            echo "OK: runtime dependencies, web bundle and stamped plugin manifests present"
          '

      # Handed to the publish job below, which pushes it once every build
      # and test job of the release passed: a pushed-then-failed image is
      # already visible to anything watching the tag.
      - name: Save the verified image for publish
        if: github.event_name != 'pull_request'
        run: docker save "${IMAGE}:${{ steps.meta.outputs.sha }}" | zstd -T0 -o server-image.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: server-image
          path: server-image.tar.zst
          retention-days: 1
          if-no-files-found: error

  # The plugin images (plugins.yml): unit tests, the end to end when
  # plugin code changed, the images built against the agent pin, smoke
  # tested and scanned, uploaded for the publish job.
  plugins:
    needs: [version, agent]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.version.result == 'success' && needs.agent.result == 'success' }}
    uses: ./.github/workflows/plugins.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}
      agent_image: ${{ needs.agent.outputs.image }}

  # Every image of the release, pushed only once every build and test
  # job passed, each under :sha-<short>, :<version> (a release) and
  # :main (a main push; a hand-pushed tag on an older commit doesn't
  # move it), the server also under its legacy bare :<short> until
  # theWyseKube pins versions. A version or sha tag is never re-pushed:
  # one that exists for this commit under this run's version is reused
  # (a re-run), one under another version is left alone (a hand-pushed
  # MINOR on a released commit: its own build is pushed as the MINOR),
  # one from another commit fails the run (deploy/publish-image.sh).
  # Each digest gets a GitHub
  # build-provenance attestation. A run without a version (a merge a
  # newer release already covers, a plain rebuild) publishes its sha
  # tags only and moves nothing.
  publish:
    needs: [version, image, plugins]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.image.result == 'success' && needs.plugins.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: ghcr.io/loomux/server
            artifact: server-image
          - name: plugin-kubernetes
            image: ghcr.io/loomux/plugin-kubernetes
            artifact: plugin-kubernetes-image
          - name: plugin-docker
            image: ghcr.io/loomux/plugin-docker
            artifact: plugin-docker-image
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}

      - name: Load the tested image
        run: zstd -d -c ${{ matrix.artifact }}.tar.zst | docker load

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: publish
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.version }}
          SERVER_SHA: ${{ needs.image.outputs.sha }}
          # The re-tagging copies manifests through the registry API.
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          short="$(git rev-parse --short=7 HEAD)"
          if [ "${NAME}" = server ]; then
            local="${IMAGE}:${SERVER_SHA}"
            tags="${short} sha-${short}"
          else
            local="${IMAGE}:test"
            tags="sha-${short}"
          fi
          [ -z "${VERSION}" ] || tags="${tags} ${VERSION}"
          [ "${GITHUB_REF}" != refs/heads/main ] || tags="${tags} main"
          # The version label this run gives its image: an existing commit
          # tag is adopted only under the same one, so a hand-pushed MINOR
          # on a released commit publishes its own build (deploy/publish-image.sh).
          # shellcheck disable=SC2086 # one word per tag
          digest="$(deploy/publish-image.sh "${IMAGE}" "${GITHUB_SHA}" "${VERSION:-sha-${short}}" "${local}" ${tags})"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir -p published
          echo "${IMAGE}:${VERSION:-sha-${short}}@${digest}" > "published/${NAME}.txt"
          {
            echo "### \`${IMAGE}:${VERSION:-sha-${short}}@${digest}\`"
            echo ""
            echo "Tags: ${tags}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # For the release notes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.name }}
          path: published/
          retention-days: 1
          if-no-files-found: error

  # The GitHub release for a version, once every image is pushed
  # (LOOM-129). Its tag already exists (reserved above, or pushed by
  # hand). The notes are the version's CHANGELOG.md section when it has
  # one (a milestone), otherwise the merged pull request's title, and
  # say which web version the release pins and which images it
  # published, each as tag@digest. 0.y.z and -pre versions are
  # pre-releases, and nothing here marks a release "latest".
  release:
    needs: [version, image, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          WEB_VERSION: ${{ needs.image.outputs.web_version }}
          WEB_SHORT: ${{ needs.image.outputs.web_short }}
        run: |
          set -eu
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then echo "${tag} is already released."; exit 0; fi
          if ! deploy/release.sh notes "${VERSION}" > notes.md 2>/dev/null; then
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[] | "- \(.title) (#\(.number))"' > notes.md
            [ -s notes.md ] || git log -1 --format='- %s' > notes.md
          fi
          printf '\nWeb client: %s (`web-%s`).\n' "${WEB_VERSION:-unversioned}" "${WEB_SHORT}" >> notes.md
          printf '\nImages:\n' >> notes.md
          for f in published/*.txt; do printf -- '- `%s`\n' "$(cat "$f")" >> notes.md; done
          pre=""
          if deploy/release.sh prerelease "${VERSION}"; then pre="--prerelease"; fi
          gh release create "${tag}" --verify-tag ${pre} --latest=false \
            --title "Loomux server ${VERSION}" --notes-file notes.md
