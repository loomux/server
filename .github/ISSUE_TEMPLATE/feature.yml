name: Feature request
description: Something Loomux should do that it doesn't.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Loomux is pre-alpha and single-user, and its design is in docs/design/core-design.md.
        A short request that starts from the problem is the most useful kind.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd want it to work. Name any API route, setting or screen it touches.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: Workarounds or other tools you've tried.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
          required: false
