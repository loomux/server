# The kind cluster CI brings up for the Kubernetes plugin's integration
# test (.github/workflows/plugins.yml). One node; the node image pinned
# by digest (from kind v0.33.0's release notes), on the Kubernetes minor
# closest to theWyseKube's. In its own directory so that
# `kubectl apply -f deploy/test/kind/` (the manifests) never sees it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: loomux
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
