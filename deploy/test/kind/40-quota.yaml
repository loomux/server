# A bound on what the namespace can hold (design §10 item 7), sized for
# the kind cluster in CI; theWyseKube's numbers are its own.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: loomux-agents
  namespace: loomux-agents
spec:
  hard:
    requests.cpu: "4"
    limits.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 16Gi
    # max_environments (5) + 2 × (nodes + 1) canaries for a restart or
    # rollout (LOOM-208, design §8): 9 on kind's one node, and a spare.
    pods: "10"
    persistentvolumeclaims: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: loomux-agents
  namespace: loomux-agents
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: "1"
        memory: 2Gi
