# The plugin's credential: rule for rule what theWyseKube's manifests
# grant (its PR #25), the verbs design §8 lists, in the agents
# namespace only. CI runs the plugin with a kubeconfig made from this
# ServiceAccount's token (kubeconfig-for-sa.sh), so a verb the plugin
# needs and this Role lacks fails the integration test. Keep it in
# step with the real grant, never wider. On a real cluster the
# ServiceAccount lives in loomuxd's namespace and is bound here (§10
# item 2).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loomux-plugin-kubernetes
  namespace: loomux-agents
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loomux-plugin-kubernetes
  namespace: loomux-agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loomux-plugin-kubernetes
  namespace: loomux-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loomux-plugin-kubernetes
subjects:
  - kind: ServiceAccount
    name: loomux-plugin-kubernetes
    namespace: loomux-agents
